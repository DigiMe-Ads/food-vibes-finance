<!DOCTYPE html>
<!-- translate="no": browser auto-translate rewrites text nodes behind React's back,
     which causes random crashes and stale buttons/labels. -->
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a3824e" />
    <title>Food Vibes Finance</title>
  </head>
  <body class="notranslate">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
